<!DOCTYPE html>
<html lang="ru">
<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>NeuroHub | Регистрация</title>

    <link rel="stylesheet"
          href="style.css">

</head>
<body>

<header>

    <div class="logo">
        🧠 NeuroHub
    </div>

    <nav>

        <a href="index.html">Главная</a>

        <a href="favorites.html">Избранное</a>
        <a href="login.html">Вход</a>

    </nav>

</header>

<section>

    <h1 style="text-align:center;margin-bottom:20px;font-size:48px;">

        Регистрация

    </h1>

    <p style="text-align:center;color:#94a3b8;margin-bottom:40px;">

        Создайте аккаунт NeuroHub

    </p>

    <form>

        <input
        type="text"
        id="username"
        placeholder="Имя пользователя">

        <input
        type="password"
        id="password"
        placeholder="Пароль">

        <button
        type="button"
        onclick="registerUser()">

            Зарегистрироваться

        </button>

    </form>

    <div
    style="
    text-align:center;
    margin-top:20px;">

        Уже есть аккаунт?

        <a
        href="login.html"
        style="color:#60a5fa;">

            Войти

        </a>

    </div>

</section>

<footer>

    <p>

        © 2026 NeuroHub

    </p>

</footer>
