<!DOCTYPE html>
<html lang="ru">
<head>

    <meta charset="UTF-8">

    <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

    <title>
        NeuroHub | Вход
    </title>

    <meta
    name="description"
    content="Вход в аккаунт NeuroHub">

    <link
    rel="stylesheet"
    href="style.css">

</head>
<body>

<header>

    <div class="logo">
        🧠 NeuroHub
    </div>

    <nav>

        <a href="index.html">
            Главная
        </a>

        <a href="catalog.html">
            Каталог
        </a>

        <a href="favorites.html">
            Избранное
        </a>

        <a href="login.html">
            Вход
        </a>

    </nav>

</header>

<section>

    <h1
    style="
    text-align:center;
    margin-bottom:20px;
    font-size:48px;">

        Вход в аккаунт

    </h1>

    <p
    style="
    text-align:center;
    color:#94a3b8;
    margin-bottom:40px;">

        Войдите в NeuroHub для доступа к избранному и отзывам

    </p>

    <form>

        <input
        type="text"
        id="username"
        placeholder="Имя пользователя">

        <input
        type="password"
        id="password"
        placeholder="Пароль">

        <button
        type="button"
        onclick="loginUser()">

            Войти

        </button>

    </form>

    <div
    style="
    text-align:center;
    margin-top:20px;">

        <p>

            Нет аккаунта?

            <a
            href="register.html"
            style="
            color:#60a5fa;">

                Зарегистрироваться

            </a>

        </p>

    </div>

</section>

<section>

    <div class="ad-box">

        Реклама

    </div>

</section>

<footer>

    <p>

        © 2026 NeuroHub

    </p>

</footer>
